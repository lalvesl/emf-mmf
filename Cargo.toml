[package]
name = "emf-mmf"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Winding factors (k_d, k_p, k_w) and the harmonic spectrum of the winding
# function. Demonstration material rather than everyday content, so it can be
# built out with `--no-default-features` for a leaner tool.
harmonics = []
web = []
dev = ["bevy/dynamic_linking"]
test = ["dev"]
# `bevy/hotpatching` is what actually re-registers systems on a subsecond
# rebuild; `dynamic_linking` alone only speeds the link step up.
hotpatching = ["bevy/dynamic_linking", "bevy/hotpatching"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["3d", "ui"] }
# , default-features = false, features = [
#     "bevy_asset",
#     "bevy_core_pipeline",
#     "bevy_gizmos",
#     "bevy_pbr",
#     "bevy_render",
#     "bevy_text",
#     "bevy_winit",
#     "default_font",
#     "multi_threaded",
#     "tonemapping_luts",
#     "wayland",
#     "webgl2",
#     "x11",
# ] }
bevy_egui = "0.41.1"

# [dev-dependencies]
# bevy = { version = "0.19.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Optimized release profile for Web (WASM) to reduce file size and improve performance
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false

[profile.performance]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false

[lib]
name = "emf_mmf"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "emf-mmf"
